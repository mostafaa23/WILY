[project]
name = "wily-scanner"
version = "0.1.0"
description = "Cloud-native, black-box API security scanner"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "mostafaa23" }]
license = { text = "MIT" }
keywords = [
    "security",
    "api-security",
    "vulnerability-scanner",
    "cloud-security",
    "pentesting",
    "ssrf",
    "jwt",
    "iam",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
]

dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "requests>=2.31",
    "aiohttp>=3.9",
    "anyio>=4.3",
    "python-dotenv>=1.0",
    "jinja2>=3.1",
    "dnspython>=2.6",
    "pyjwt>=2.8",
    "cryptography>=42.0",
    "networkx>=3.2",
]

[project.optional-dependencies]
ml = ["scikit-learn>=1.4", "numpy>=1.26", "joblib>=1.3"]
aws = ["boto3>=1.34"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4", "flask>=3.0"]

[project.urls]
Homepage = "https://github.com/mostafaa23/wily"
Repository = "https://github.com/mostafaa23/wily"

[project.scripts]
wily = "wily.cli.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wily"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# A pragmatic, security-tool-aware rule set. We enforce correctness, modern
# syntax, import hygiene, and common bug / simplification lints. We deliberately
# leave a few rule groups out, each for a concrete reason:
#   * flake8-bandit (S): Wily is a pentesting tool, so its own code legitimately
#     does what bandit flags (unverified TLS probes, weak-hash tests, broad
#     network and subprocess I/O). Auditing ourselves with bandit is noise, not
#     signal. Add individual S rules back if a real class of bug appears.
#   * flake8-blind-except (BLE001): scanners catch broad exceptions at scan /
#     parse boundaries on purpose, so one failing probe or malformed response
#     never aborts a whole run. This is a design choice, applied in ~20 files.
#   * E501 (line length): the codebase has never enforced a width. Leave
#     wrapping to `ruff format` rather than hand-editing lines during a lint pass.
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "PYI", "FURB", "FLY", "RUF"]
ignore = [
    "E501",   # line length is not enforced (see note above)
    "UP042",  # `class X(str, Enum)` -> `StrEnum` changes str()/format() output;
              # these enums are serialized, so keep the explicit str mixin.
]

[tool.ruff.lint.flake8-bugbear]
# Typer's dependency-injection idiom passes typer.Option() / typer.Argument()
# as parameter defaults; these are safe sentinels, not the mutable-default bug
# that B008 is meant to catch.
extend-immutable-calls = ["typer.Option", "typer.Argument"]
