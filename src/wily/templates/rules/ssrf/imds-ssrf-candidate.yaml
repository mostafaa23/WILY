id: cloud-ssrf-imds-candidate
info:
  name: "Candidate SSRF parameter pointing to cloud metadata"
  severity: high
  category: cloud-ssrf
  description: >
    Probes candidate parameters (url=, callback=, webhook=, ...) by
    sending a canary URL instead of targeting 169.254.169.254 directly,
    which reduces the risk of accidentally hitting infrastructure the
    user doesn't actually own.

    NOTE: this rule is NOT self-contained. Confirming a blind/out-of-band
    SSRF needs an external interaction server (an interactsh-style
    listener, or Wily's own core/oob_canary.OOBCanaryServer) to observe the
    callback the target makes to {{CANARY_URL}}. The generic YAML rule
    runner has no such listener, so it skips this rule and records the
    reason; the working end-to-end blind-SSRF path lives in the code
    scanner scanners/ssrf_imds.py (run via `wily ssrf ... --blind`). This
    file documents the rule shape and keeps the matcher schema-valid until
    the runner grows an OOB-callback evidence source.

asset-type: http-endpoint-with-param

authorization:
  mode: passive
  requires-tenant-pair: false
  requires-owned-infra: true   # the active IMDSv1 step needs this condition

# {{CANARY_URL}} is supplied by an out-of-band interaction server at run
# time; without one it stays unresolved and the runner skips the rule.
request:
  - method: GET
    path: "{{BaseURL}}?url={{CANARY_URL}}"

matchers-condition: and
matchers:
  # Evaluated against the OOB listener's log, not the HTTP response, so the
  # generic runner cannot decide it (UnsupportedMatcherError -> skipped with
  # a recorded reason). Kept here as the declared success condition.
  - type: dsl
    dsl:
      - "canary_hit == true"

evidence:
  - callback_log
  - response_time_delta

remediation: >
  Restrict the server's outbound requests (egress filtering), enforce
  IMDSv2 only (hop-limit=1), and use an explicit allow-list of domains
  the application is permitted to connect to.
