id: secret-exposure-response-body
info:
  name: "Exposed API key or cloud credential in response body"
  severity: high
  # Aligns with scanners/secret_scan.py's category family (secret-exposure-*).
  category: secret-exposure-response-body
  description: >
    Searches the HTTP response body for the shapes of hard-coded secrets -
    AWS access keys, Google API keys, GitHub/Slack tokens, and PEM private
    key blocks. A hit means a credential is being served to any client and
    must be treated as compromised and rotated.

asset-type: http-endpoint

authorization:
  mode: passive
  requires-tenant-pair: false
  requires-owned-infra: false

request:
  - method: GET
    path: "{{BaseURL}}"

# Any one secret shape is enough to flag the response.
matchers-condition: or
matchers:
  - type: regex
    part: body
    condition: or
    regex:
      # AWS access key IDs (AKIA long-term, ASIA temporary/STS, ...).
      - "\\b(?:AKIA|ASIA|ABIA|ACCA)[0-9A-Z]{16}\\b"
      # Google API key (AIza..., 39 chars).
      - "\\bAIza[0-9A-Za-z\\-_]{35}\\b"
      # GitHub personal/OAuth/app/refresh tokens.
      - "\\bgh[posru]_[A-Za-z0-9]{36,255}\\b"
      # Slack tokens (bot/user/app/refresh/legacy).
      - "\\bxox[baprs]-[A-Za-z0-9-]{10,}\\b"
      # PEM private key block header.
      - "-----BEGIN (?:RSA |EC |DSA |OPENSSH |PGP )?PRIVATE KEY-----"

evidence:
  - response_body

remediation: >
  Remove the secret from the shipped response/code and rotate it immediately
  (assume it is compromised). Load secrets at runtime from a secrets manager
  (AWS Secrets Manager / SSM Parameter Store), never bake them into frontend
  bundles or API responses, and add a CI secret scanner to catch regressions.
