name: Release

# Publish to PyPI when a GitHub Release is published.
#
# This uses PyPI Trusted Publishing (OpenID Connect): PyPI trusts this exact
# repository + workflow, so there is NO API token to store as a secret. The
# one-time setup is on PyPI:
#   PyPI -> Your projects -> wily-scanner -> Settings -> Publishing
#   (or, before the first release, PyPI -> Account -> Publishing ->
#    "Add a pending publisher")
#   owner:       mostafaa23
#   repository:  wily
#   workflow:    release.yml
#   environment: pypi
#
# To cut a release:
#   1. bump `version` in pyproject.toml and commit
#   2. git tag v0.1.0 && git push origin v0.1.0
#   3. create a GitHub Release from that tag -> this workflow runs and publishes

on:
  release:
    types: [published]

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade build

      - name: Build the distribution
        run: python -m build

      - name: Check the distribution metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*

      - name: Upload the built distribution
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # The environment name must match the Trusted Publisher configured on PyPI.
    environment:
      name: pypi
      url: https://pypi.org/p/wily-scanner
    permissions:
      # Required for Trusted Publishing (OIDC). No token/secret is used.
      id-token: write
    steps:
      - name: Download the built distribution
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
